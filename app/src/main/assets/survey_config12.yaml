graph:
  start_id: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      next_id: Q1

    - id: Q1
      type: AI
      title: FAW Yield Loss (3 Seasons)
      question: >-
        How much yield do you lose because of fall armyworm? Please think back over the last 3 seasons. (Percent or bags per acre are fine.)
      next_id: Q2

    - id: Q2
      type: AI
      title: Trade-off for 10-Day Earlier Harvest
      question: >-
        If you could harvest 10 days earlier, how much yield would you be willing to give up? (Percent or bags per acre.)
      next_id: Q3

    - id: Q3
      type: AI
      title: Damage Threshold to Switch Variety
      question: >-
        What level of pest or disease damage would make you stop using your current maize variety and switch to a new variety? (Give a clear threshold, e.g., % plants/ears damaged or severity.)
      next_id: Q4

    - id: Q4
      type: AI
      title: Expectations for Replacement Variety
      question: >-
        What would you expect from a new maize variety to replace the one you currently grow? Please be as detailed as possible (e.g., DTM, FAW tolerance, drought stage tolerance, typical yield).
      next_id: Q5

    - id: Q5
      type: AI
      title: Minimum Acceptable Harvest in Bad Year
      question: >-
        In a bad year, what is the smallest harvest you would accept and still plant this maize again next season? (Percent of usual harvest or bags per acre.)
      next_id: Q6

    - id: Q6
      type: AI
      title: Most Damaging Drought Timing
      question: >-
        When in the season is drought most devastating for your crop? What is the most difficult drought moment? (e.g., pre-tassel, tasseling/silking, grain fill, pre-harvest.)
      next_id: Review

    - id: Review
      type: REVIEW
      title: Review
      next_id: Done

    - id: Done
      type: DONE
      title: Done

qa_eval:
  enabled: true
  mode: two_call
  followup_trigger: needs_followup
  eval_ok_score_threshold: 85
  skip_followup_when_ok: true
  fallback_to_inline_followup: true


slm:
  accelerator: "GPU"

  # MediaPipe/LiteRT-LM: max_tokens is often an (input + output) budget and may be capped (e.g., 2048).
  max_tokens: 4096

  # Sampling (more stable for strict JSON)
  top_k: 20
  top_p: 0.9
  temperature: 0.3
  repetition_penalty: 1.1

  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: "<end_of_turn>"

  empty_json_instruction: "Respond with an empty JSON object: {}"
  preamble: "You are a well-known farmer survey expert. Read the Question and the Answer."
  scoring_rule: "Scoring rule: Judge ONLY content relevance/completeness/accuracy. Do NOT penalize style or formatting."

  eval_key_contract: |
    OUTPUT FORMAT:
    - In English.
    - Keys:
      • "analysis": short string
      • "expected_answer": short string
      • "needs_followup": boolean
      • "missing": short string (what is missing/unclear; empty if none)
      • "follow_up_question": string (empty if needs_followup=false)
      • "score": integer 1–100
    FOLLOW-UP INTENT:
    - If needs_followup=true, the follow-up must confirm or clarify the respondent's original answer to the SAME question.
    - Target the biggest uncertainty: missing unit/scale, missing number, time window, baseline, or method used.
    - Keep it single-scope (no multi-part), concrete, and answerable immediately.
    - Do not introduce new topics or additional objectives.

  eval_length_budget: |
    LENGTH LIMITS:
    - analysis<=60 chars; follow_up_question<=120; expected_answer<=120; missing<=60.

  eval_strict_output: |-
    STRICT OUTPUT (NO MARKDOWN):
    - RAW JSON only, ONE LINE.
    - No extra text.

  followup_contract: |
    FOLLOW-UP OUTPUT:
    - In English.
    - Output EXACTLY ONE single-sentence question.
    - Plain text only (no JSON, no markdown).
    - Must validate/clarify the SAME answer; do not introduce new topics.

prompts:
  - node_id: "Q1#eval"
    prompt: |-
      Task:
      - Evaluate the respondent's answer for completeness and clarity.
      - Produce a strong expected_answer: avg FAW yield loss over last 3 seasons (% or bags/acre); note high variability if present.
      - Decide needs_followup:
        • true if unit/baseline/time window/value is unclear or missing
        • false if answer is already specific enough
      - If needs_followup=true, propose follow_up_question (single short sentence).
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q1#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

  - node_id: "Q2#eval"
    prompt: |-
      Task:
      - Evaluate completeness of the trade-off answer (units, magnitude, boundary).
      - Provide expected_answer: willingness-to-accept yield loss to harvest 10 days earlier (% or bags/acre), optionally with a one-clause reason.
      - Set needs_followup accordingly; propose follow_up_question only if needed.
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q2#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

  - node_id: "Q3#eval"
    prompt: |-
      Task:
      - Evaluate whether a clear switching threshold is provided (metric + stage).
      - Provide expected_answer: a specific threshold (e.g., ≥X% plants/ears with moderate+ damage, or severity at tasseling).
      - Set needs_followup accordingly; propose follow_up_question only if needed.
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q3#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

  - node_id: "Q4#eval"
    prompt: |-
      Task:
      - Evaluate whether the replacement variety expectations include measurable targets.
      - Provide expected_answer: list 2 compact trait targets with numeric/categorical thresholds (e.g., DTM range, FAW tolerance, drought stage tolerance, yield).
      - Set needs_followup accordingly; propose follow_up_question only if needed.
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q4#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

  - node_id: "Q5#eval"
    prompt: |-
      Task:
      - Evaluate whether minimum acceptable harvest includes baseline and unit.
      - Provide expected_answer: minimum acceptable harvest in a bad year (% or bags/acre) plus a terse decision rule.
      - Set needs_followup accordingly; propose follow_up_question only if needed.
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q5#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

  - node_id: "Q6#eval"
    prompt: |-
      Task:
      - Evaluate whether drought timing is mapped to a clear crop stage and includes a reason.
      - Provide expected_answer: most damaging drought moment as a crop stage with a one-clause reason.
      - Set needs_followup accordingly; propose follow_up_question only if needed.
      - Fill missing with the biggest uncertainty (or empty string).
      - Score 1–100.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - node_id: "Q6#followup"
    prompt: |-
      Generate exactly ONE follow-up question to clarify the SAME answer.
      Use the EVAL JSON to pick the biggest uncertainty.
      Output plain text only (no JSON, no markdown), one sentence.

      Question: {{QUESTION}}
      Answer: {{ANSWER}}
      EVAL_JSON: {{EVAL_JSON}}

model_defaults:
  default_model_url: "https://huggingface.co/google/gemma-3n-E4B-it-litert-lm/resolve/main/gemma-3n-E4B-it-int4.litertlm"
  default_file_name: "Gemma3n4B.litertlm"
  timeout_ms: 1800000
  ui_throttle_ms: 250
  ui_min_delta_bytes: 32

whisper:
  enabled: true
  asset_model_path: "models/ggml-small-q5_1.bin"
  language: "en"
  translate: false
  print_timestamp: false
  target_sample_rate: 16000
  record_sample_rates: [16000, 48000, 44100]
  compute_checksum: true
